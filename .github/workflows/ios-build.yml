name: iOS Build

# Builds Roamly on a macOS runner with Xcode 16 so every push gets a real
# compile check — the one thing that can't be done on Linux.

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Roamly
        run: |
          xcodebuild build \
            -project Roamly.xcodeproj \
            -scheme Roamly \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
