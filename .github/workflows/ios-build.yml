name: iOS Build & Test

# Builds and tests Roamly on a macOS runner with Xcode 16 so every push gets a
# real compile + unit-test check — the one thing that can't be done on Linux.

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve a simulator destination
        id: sim
        run: |
          # Pick the first available iPhone simulator device name for this runner.
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+( Pro)?' | head -1)
          echo "Using device: ${DEVICE:-iPhone 16}"
          echo "device=${DEVICE:-iPhone 16}" >> "$GITHUB_OUTPUT"

      - name: Build & test Roamly
        run: |
          xcodebuild test \
            -project Roamly.xcodeproj \
            -scheme Roamly \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
